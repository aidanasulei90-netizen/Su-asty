<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <title>Салыстыру - Карандашпен салу</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; font-family: 'Arial', sans-serif;
            background: #0081cc;
        }

        #round-info {
            position: absolute; top: 15px; left: 50%;
            transform: translateX(-50%);
            background: white; padding: 10px 30px;
            border-radius: 25px; font-weight: bold; font-size: 26px;
            color: #004d7a; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .main-board {
            position: absolute; top: 45%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90%; height: 420px;
            background: rgba(255, 255, 255, 0.1);
            border: 6px solid white; border-radius: 50px;
            display: flex; align-items: center; justify-content: space-around;
        }

        .item-group {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 12px; width: 35%; justify-items: center;
        }

        .item-group img { width: 75px; height: 75px; object-fit: contain; }

        /* CANVАS (СУРЕТ САЛУ АЛАҢЫ) */
        .canvas-box {
            width: 200px; height: 200px;
            background: white; border-radius: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative; cursor: crosshair;
        }

        canvas { width: 100%; height: 100%; touch-action: none; }

        /* БАСҚАРУ ТҮЙМЕЛЕРІ */
        .controls {
            position: absolute; bottom: 40px; width: 100%;
            display: flex; justify-content: center; gap: 20px;
        }

        .btn {
            padding: 15px 40px; border-radius: 20px; border: none;
            color: white; font-weight: bold; font-size: 20px; cursor: pointer;
            box-shadow: 0 5px 0 rgba(0,0,0,0.15); transition: 0.2s;
        }

        .btn:active { transform: translateY(3px); box-shadow: none; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="round-info">Кезең: 1 / 8</div>

    <div class="main-board">
        <div class="item-group" id="left-side"></div>
        
        <div class="canvas-box">
            <canvas id="paint"></canvas>
        </div>

        <div class="item-group" id="right-side"></div>
    </div>

    <div class="controls">
        <button class="btn" style="background: #e67e22;" onclick="window.location.href='page3.html'">⬅ АЛДЫҢҒЫ БЕТ</button>
        <button class="btn" style="background: #3498db;" id="clear">🔄 ӨШІРУ</button>
        <button class="btn" style="background: #2ecc71;" id="check">✅ ТЕКСЕРУ</button>
    </div>
</div>

<script>
    let currentRound = 1;
    const fishImages = ['starfish.png', 'seahorse.png', 'fish.png', 'crab.png', 'octopus.png'];
    
    const canvas = document.getElementById('paint');
    const ctx = canvas.getContext('2d');
    let drawing = false;

    canvas.width = 200;
    canvas.height = 200;
    ctx.lineWidth = 10;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#2c3e50';

    function initGame() {
        if (currentRound > 8) {
            alert("Жарайсың! 8 кезеңді де бітірдің!");
            currentRound = 1;
        }
        document.getElementById('round-info').innerText = `Кезең: ${currentRound} / 8`;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // ЛОГИКА: 3 жағдайдың біреуін таңдау (0: <, 1: =, 2: >)
        const type = Math.floor(Math.random() * 3);
        let L, R;

        if (type === 1) { // ТЕҢ БОЛАТЫН ЖАҒДАЙ
            L = Math.floor(Math.random() * 8) + 1;
            R = L;
        } else if (type === 0) { // ОҢ ЖАҚ КӨП
            L = Math.floor(Math.random() * 4) + 1;
            R = L + Math.floor(Math.random() * 4) + 1;
        } else { // СОЛ ЖАҚ КӨП
            R = Math.floor(Math.random() * 4) + 1;
            L = R + Math.floor(Math.random() * 4) + 1;
        }

        const img = fishImages[Math.floor(Math.random() * fishImages.length)];
        render('left-side', L, img);
        render('right-side', R, img);
    }

    function render(id, count, src) {
        const div = document.getElementById(id);
        div.innerHTML = "";
        for(let i=0; i<count; i++) {
            div.innerHTML += `<img src="${src}">`;
        }
    }

    // СУРЕТ САЛУ
    function start(e) { drawing = true; paint(e); }
    function end() { drawing = false; ctx.beginPath(); }
    function paint(e) {
        if (!drawing) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;
        ctx.lineTo(x, y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y);
    }

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', paint);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); start(e.touches[0]); });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); paint(e.touches[0]); });
    canvas.addEventListener('touchend', end);

    document.getElementById('clear').addEventListener('click', () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    document.getElementById('check').addEventListener('click', () => {
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        currentRound++;
        setTimeout(initGame, 1500);
    });

    initGame();
</script>
</body>
</html>
