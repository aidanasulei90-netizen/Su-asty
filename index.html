<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бастапқы бет - 16:9</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* Видеодан бос қалған жер қара болады */
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Arial', sans-serif;
        }

        /* 16:9 Контейнер */
        .video-container {
            position: relative;
            width: 100vw;
            height: calc(100vw * 9 / 16); /* Пропорция 16:9 */
            max-height: 100vh;
            max-width: calc(100vh * 16 / 9);
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain; /* Видеоны бұзбай, контейнерге сыйғызу */
        }

        /* Плей белгісі */
        #play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        #play-overlay svg {
            fill: white;
            width: 40px;
            height: 40px;
        }

        /* Навигациялық батырма */
        .bottom-nav {
            position: fixed; /* Экранға қатысты бекіту */
            bottom: 20px;
            right: 20px;
            z-index: 20;
        }

        .btn-3d {
            padding: 8px 20px;
            font-size: 15px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            display: inline-block;
            border-radius: 30px;
            background: linear-gradient(180deg, #3498db, #2980b9);
            box-shadow: 0 4px #1c5982, 0 8px 15px rgba(0, 0, 0, 0.3);
            border: 1.5px solid #5dade2;
            cursor: pointer;
            transition: all 0.1s;
            position: relative;
            overflow: hidden;
        }

        .btn-3d::after {
            content: '';
            position: absolute;
            top: 0;
            left: 5%;
            width: 90%;
            height: 35%;
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 100%);
            border-radius: 30px 30px 10px 10px;
        }

        .btn-3d:active {
            box-shadow: 0 2px #1c5982, 0 4px 8px rgba(0, 0, 0, 0.3);
            transform: translateY(2px);
        }
    </style>
</head>
<body>

<div class="video-container">
    <video id="myVideo" playsinline>
        <source src="video.mp4" type="video/mp4">
    </video>

    <div id="play-overlay" onclick="togglePlay()">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>
</div>

<div class="bottom-nav">
    <a href="page2.html" class="btn-3d">Келесі ➡</a>
</div>

<script>
    const video = document.getElementById('myVideo');
    const playOverlay = document.getElementById('play-overlay');

    function togglePlay() {
        if (video.paused) {
            video.play();
            video.controls = true; 
            playOverlay.style.opacity = '0';
            setTimeout(() => {
                playOverlay.style.visibility = 'hidden';
            }, 300);
        } else {
            video.pause();
            playOverlay.style.visibility = 'visible';
            playOverlay.style.opacity = '1';
        }
    }

    video.onended = function() {
        playOverlay.style.visibility = 'visible';
        playOverlay.style.opacity = '1';
        video.controls = false;
    };
</script>

</body>
</html>
